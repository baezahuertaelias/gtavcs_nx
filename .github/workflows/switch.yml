name: Switch platform smoke build
on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_switch.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/switch/gtavcs_nx/gtavcs.nro
            build/evidence/M01/checksums.json
            build/evidence/M01/readelf.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-build-logs-${{ github.sha }}
          retention-days: 14
          path: build/evidence/M01/*.log
