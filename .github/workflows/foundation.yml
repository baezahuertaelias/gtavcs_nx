name: Foundation and milestone policy
on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_project.py
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
  milestone-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require completed tasks and independent candidate review
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_BRANCH" =~ ^milestone/m([0-9]{2})- ]]; then
            echo 'A milestone branch is required'; exit 1
          fi
          python tools/milestone_gate.py "M${BASH_REMATCH[1]}" --branch "$HEAD_BRANCH" --require-review
