# M08-08 / 14 / 16: L3 + R3 on paired Joy-Cons in handheld, from an empty test card (the session tool deletes this
# profile first), intro movies skipped for this run. The person opens and closes the developer menu with L3 + R3 in S2
# (the opening flyover), in S3 (the intro cutscene, before skipping it) and in S4 (Fort Baxter), and once in S4 opens it,
# presses HOME, comes back and closes it; then closes the game from HOME. Every chord event ([chord]: what the game
# was given for each L3 / R3 press), every menu change ([devmenu]), every controller button ([input]) and the game's
# pad read (padstate) are logged; the menus' state every 2 s.
profile m08-chord
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
env VCS_NX_INPUT_LOG=1
report 10
every 2 1 3599 devmenu
every 1 1 3599 padstate
every 10 5 3595 player
every 30 15 3585 gameinfo
