# M07-02: the game volume settings. The same no-input S1-S4 schedule as m07-pcm.cfg, with the run's vcs.ini (put
# by switch_m06_session.py --settings tests/switch/m07-volume.ini) setting music and effects to 0 %: the SPU2 recording
# must fall to near silence against m07-pcm's (tools/pcm_compare.py), the movies' own sound aside (not in the dump).
profile m07-volume
env PS2X_AUDIO_DUMP=userdata/tests/m07-volume/game.wav
env PS2X_AUDIO_STATS=1
env PS2X_RHI_STATS=1
seconds 300
report 5
every 10 5 295 player
every 30 15 285 gameinfo
at 296 perf
