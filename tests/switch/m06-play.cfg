# M06-18 beta acceptance (and M06-14 / M06-16 controller checks): an empty test card (the session tool deletes this
# profile first), no scripted input at all. The person skips S3 with Cross on the real controller if they want, then
# plays at Fort Baxter - walks, runs, looks around - for at least 5 continuous minutes, then closes the game from HOME
# (the orderly exit). Every controller button and axis change is logged ([input]), with the physical connection
# ([platform] controller physical) and the game's player state every 10 s. No time limit.
profile m06-play
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_GPU_LOG=userdata/tests/m06-play/gpu.csv
env PS2X_PERF_LOG=userdata/tests/m06-play/perf.csv
env VCS_NX_INPUT_LOG=1
report 10
every 10 5 1795 player
every 60 30 1770 gameinfo
every 60 60 1800 perf
