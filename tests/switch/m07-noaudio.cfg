# M07-09: error recovery when no audio device opens. PS2X_AUDIO=0 keeps the output closed, as when SDL cannot open
# one: the native sound driver, the movies and the intro cutscene must run on without it (S4 reached, no stall), as
# m06-silent.cfg showed before patch 0010 and switch-ffmpeg. No input.
profile m07-noaudio
env PS2X_AUDIO=0
env PS2X_RHI_STATS=1
env PS2X_PERF_LOG=userdata/tests/m07-noaudio/perf.csv
env PS2X_CAPTURE_SIZE=640x448
seconds 360
report 5
every 10 5 355 player
every 30 15 345 gameinfo
at 356 perf
