# M04 settings and integrity: two settings saves through the game's own settings path (the second renames vcs.ini
# onto the file the first wrote: EEXIST on the Switch before overlay 0007), and the whole disc tree hashed against
# the manifest before boot (FolderDisc::verifyFiles).
profile m04-files
env VCS_SKIP_MOVIES=1
verify-files
seconds 45
report 5
at 15 setting display.fps 30
at 20 setting display.fps
at 25 setting display.fps 60
at 30 setting display.fps
at 32 setting audio.volume 90
at 35 frames
