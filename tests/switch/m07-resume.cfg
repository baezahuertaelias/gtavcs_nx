# M07-08 / 09 (review 3, finding 2): suspend and resume on the candidate NRO. The person, in order: HOME during the
# opening movie, about 5 s on the HOME menu, back into the game; once the player walks, sleep (power button), about 5 s,
# wake; then close from HOME. No time limit. VCS_MOVIE_LOG=1 gives the movie's clock across the HOME; PS2X_AUDIO_STATS=1
# the ring's underruns, dropped frames and queue depth every 5 s (the cost after each resume); every input logged.
profile m07-resume
env PS2X_AUDIO_STATS=1
env VCS_MOVIE_LOG=1
env PS2X_RHI_STATS=1
env VCS_NX_INPUT_LOG=1
report 10
every 10 5 3595 player
every 30 15 3585 gameinfo
