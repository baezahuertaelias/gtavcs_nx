# M07-04 / 05 / 08 / 09 / 10: the person plays and listens (NRO with patch 0010). In order: the boot movie with HOME
# pressed during it and resumed, then skipped with B; play on foot (effects, voices, ambient sound); a car with the radio
# (stations changed), driven between areas; a sound on one side (left / right); sleep (power button) during play and
# wake; then close from HOME. No time limit. Audio stats every 5 s, every input logged, gameinfo every 30 s.
profile m07-listen
env PS2X_AUDIO_STATS=1
# M07-04 (review 1): the SPU2 voices sounding at once, every 5 s ("[spu2] 5 s: ... active now N")
env PS2X_TRACE_SPU2=1
env PS2X_RHI_STATS=1
env VCS_NX_INPUT_LOG=1
env VCS_STREAM_LOG=1
report 10
every 10 5 3595 player
every 30 15 3585 gameinfo
