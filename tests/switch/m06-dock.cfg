# M06-20: mode-appropriate output on the fixed 1920x1080 surface. The log's [video] lines show the output size per
# mode (1280x720 handheld, 1920x1080 docked) and the heap at each change; the person checks the picture fills the
# panel (and the TV), 4:3 pillarboxed, with nothing cut off. M06 ran it from a handheld start with no dock changes
# (output-handheld); docking every ~20 s from both start modes is M10-13 (user decision: no dock).
profile m06-dock
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
env PS2X_CAPTURE_SIZE=640x448
seconds 240
report 5
every 4 10 120 press cross
every 15 15 225 frames
at 236 perf
