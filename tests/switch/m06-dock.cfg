# M06-20 / M06-13: mode-appropriate output on the fixed 1920x1080 surface. The person docks and undocks about every
# 20 s while the game runs (prompted by the session tool). The log's [video] lines show the output size per mode
# (1280x720 handheld, 1920x1080 docked) and the heap at each change; the person checks the picture fills the panel
# and the TV, 4:3 pillarboxed, sharp, with nothing cut off. Run it from a handheld start and from a docked start.
profile m06-dock
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
env PS2X_CAPTURE_SIZE=640x448
seconds 240
report 5
every 4 10 120 press cross
every 15 15 225 frames
at 236 perf
