# M08-03 / 04 / 15: settings through the registry and the developer menu, no person needed. The session tool puts
# tests/switch/m08-damaged.ini as this profile's vcs.ini first (--settings): every damaged line must be ignored with a
# "[settings] ... ignoring" line, the good one loaded. Then the control channel changes three settings, opens the
# developer menu and from it the settings menu and the trainer, starts and stops the frame-time recording (a CSV under
# userdata/perf), and the run stops itself. The profile's vcs.ini is read back: damaged lines repaired, changes saved.
profile m08-settings
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
report 10
at 15 devmenu
at 20 setting display.fps_counter 2
at 21 setting audio.volume 80
at 22 setting switch.diagnostics 1
at 25 devmenu open
at 30 devmenu settings
at 35 devmenu trainer
at 40 devmenu close
at 42 setting switch.frame_recording
at 55 setting switch.frame_recording
at 58 devmenu
seconds 65
