# M06-07 repeatable route, M06-02..05 / M06-09 pictures, M06-11 timing, M06-15 movies: from an empty test card
# (the session tool deletes this profile first) through S1-S4 with the OpenGL renderer. No VCS_SKIP_MOVIES: the
# build has no FFmpeg, so the movies take vcs_movie's no-decoder path ("built without FFmpeg, skipped" in the log).
# Cross every 4 s from 10 s to 170 s (control channel, the M04/M05 schedule; desktop reference: tools/m04_reference.py)
# skips the flyover and the S3 cutscene. Every frame's time to perf.csv, GPU time per frame to gpu.csv. Nobody
# touches the console; run it once handheld and once docked.
profile m06-route
env PS2X_RHI_STATS=1
env PS2X_GL_GPU_TIME=1
env PS2X_GL_GPU_LOG=userdata/tests/m06-route/gpu.csv
env PS2X_PERF_LOG=userdata/tests/m06-route/perf.csv
env PS2X_CAPTURE_SIZE=640x448
env VCS_STREAM_LOG=1
seconds 300
report 5
every 4 10 170 press cross
every 10 5 295 player
every 30 15 285 gameinfo
every 30 15 285 menustate
at 2 screenshot userdata/tests/m06-route/s1-002.png
at 6 screenshot userdata/tests/m06-route/s2-006.png
at 15 screenshot userdata/tests/m06-route/s2-015.png
at 30 screenshot userdata/tests/m06-route/s2-030.png
at 50 screenshot userdata/tests/m06-route/s3-050.png
at 70 screenshot userdata/tests/m06-route/s3-070.png
at 110 screenshot userdata/tests/m06-route/s4-110.png
at 150 screenshot userdata/tests/m06-route/s4-150.png
at 200 screenshot userdata/tests/m06-route/s4-200.png
at 250 screenshot userdata/tests/m06-route/s4-250.png
at 290 screenshot userdata/tests/m06-route/s4-290.png
at 60 perf
at 120 perf
at 240 perf
at 296 perf
