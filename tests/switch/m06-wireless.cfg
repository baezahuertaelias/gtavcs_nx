# M06-14 / M06-16 wireless: paired Joy-Cons off the console. Cross presses (control channel) skip S2 / S3 until 26 s;
# then the person slides both Joy-Cons off and, wireless, walks with the left stick, turns the camera with the right
# stick, presses + twice (pause and back) and A. Every SDL button / axis change and the physical connection are
# logged; the player's position every 5 s shows movement while the style is paired Joy-Cons (dual).
profile m06-wireless
env VCS_NX_INPUT_LOG=1
env PS2X_RHI_STATS=1
seconds 150
report 10
every 4 10 26 press cross
every 5 5 145 player
every 30 30 120 gameinfo
