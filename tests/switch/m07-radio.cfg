# M07-05: the music streams during a drive. m07-drive.cfg's schedule for 8 minutes with VCS_MUSIC_LOG=1: every music
# command the game sends the native driver (stream opens with their start position, the loop flag 0x90500, stops), so
# the radio's stations, their seeks and loops in the car are on the record; audio stats every 5 s.
profile m07-radio
env PS2X_RHI_STATS=1
env VCS_STREAM_LOG=1
env PS2X_AUDIO_STATS=1
# M07-04 (review 1): the SPU2 voices sounding at once, every 5 s ("[spu2] 5 s: ... active now N")
env PS2X_TRACE_SPU2=1
env VCS_MUSIC_LOG=1
seconds 480
report 10
every 4 10 26 press cross
at 32 scm b101cfa5070107010701070107019b00cfa52300
at 34 scm 600108d3002802480008d30009cd44c9c4097b5404c309c3f57c410d4e000d09cd44c9c4097b5404c3090000c8c21c02cfa50db2010d07010701070107010701620108d3002300
at 44 cruise start userdata/m06-city.txt 40 loop
every 60 60 420 cruise status
every 10 5 475 player
every 120 60 420 gameinfo
at 476 perf
