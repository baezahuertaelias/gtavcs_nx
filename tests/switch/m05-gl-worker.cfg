# M05-09 option B: the same run with textures made on the GS stage's helper threads through the GL loader context
# (PS2X_GL_WORKER_CONTEXT=1, PS2X_HW_EARLY_TEXTURES=1); compare its perf and frame lines with m05-gl.
profile m05-gl-worker
env PS2X_GL_WORKER_CONTEXT=1
env PS2X_HW_EARLY_TEXTURES=1
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
env PS2X_CAPTURE_SIZE=640x448
seconds 240
report 5
every 4 10 170 press cross
every 10 5 235 frames
every 30 15 225 gameinfo
