# M08-04: the same profile started again (--keep-card): the "[settings] ... not at their default" line must list what
# m08-settings saved (display.fps_counter=2, audio.volume=80, switch.diagnostics=1, audio.movie_volume=50). Then the
# Advanced page's "Reset all settings" action through the control channel; the next run (m08-reset) checks it held.
profile m08-settings
env VCS_SKIP_MOVIES=1
report 10
at 20 setting display.fps_counter
at 30 setting advanced.reset_all
at 32 setting display.fps_counter
seconds 40
