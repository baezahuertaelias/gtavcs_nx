# M07-07 first light: the boot movies (STINGS.PSS, INTRO.PSS) decoded by the locked switch-ffmpeg, with sound. Nobody
# touches the console until the movies have ended (no input: no skip); the person watches and listens: picture, colours,
# aspect, sound, lip / music sync. Screenshots during the movies; [movie] lines give pictures shown / dropped and the
# sound clock; PS2X_AUDIO_STATS=1 the audio ring's underruns and fill every 5 s.
profile m07-movies
env PS2X_RHI_STATS=1
env PS2X_AUDIO_STATS=1
env PS2X_PERF_LOG=userdata/tests/m07-movies/perf.csv
env PS2X_CAPTURE_SIZE=640x448
seconds 240
report 5
every 10 5 235 player
every 30 15 225 gameinfo
at 8 screenshot userdata/tests/m07-movies/movie-008.png
at 20 screenshot userdata/tests/m07-movies/movie-020.png
at 40 screenshot userdata/tests/m07-movies/movie-040.png
at 70 screenshot userdata/tests/m07-movies/movie-070.png
at 120 screenshot userdata/tests/m07-movies/after-120.png
at 236 perf
