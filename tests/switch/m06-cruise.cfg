# M06-12, review 3: the heap during moving play with streaming. Cross every 4 s skips S2 / S3; at 30 s and 36 s
# Triangle puts the player on Martinez's bike (next to him at the S4 spot); then upstream's rig cruise moves the bike
# along upstream's tools/routes/city.txt (a low route over the busiest cells on both sides of the bay, ~6 km, copied
# to gamefolder/userdata/m06-city.txt by the session) at 40 m/s in a loop, so new areas stream in all the time.
# Nobody touches the console (auto-sleep off). heap_in_use / heap_obtained on the progress line every 10 s;
# VCS_STREAM_LOG=1 logs the stream reads.
profile m06-cruise
env PS2X_RHI_STATS=1
env VCS_STREAM_LOG=1
seconds 1560
report 10
every 4 10 26 press cross
at 30 press triangle
at 36 press triangle
at 44 cruise start userdata/m06-city.txt 40 loop
at 60 cruise status
every 60 120 1500 cruise status
every 10 5 1555 player
every 120 60 1500 gameinfo
at 1556 perf
