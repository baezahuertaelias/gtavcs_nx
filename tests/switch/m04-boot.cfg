# M04 boot from an empty test card: the real runtime with the null renderer, no movies (FFmpeg is M07).
# The same schedule drives the desktop reference (tools/m04_reference.py) so the two logs compare line by line.
# Cross every 4 s from 10 s skips the title flyover and the intro cutscene, as upstream's rig.new_game does.
profile m04-boot
env VCS_SKIP_MOVIES=1
env VCS_STREAM_LOG=1
seconds 240
report 5
every 4 10 170 press cross
every 10 5 235 frames
every 10 5 235 peek 0x489f7c 4
every 10 5 235 player
every 30 15 225 gameinfo
every 30 15 225 menustate
every 30 15 225 soundstate
at 200 scripts
at 236 perf
