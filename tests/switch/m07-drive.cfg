# M07-10 / M07-05: audio during a long streaming drive. m06-drive.cfg's schedule (the car on upstream's city route at
# 40 m/s in a loop, nobody touching the console) for 15 minutes with the audio ring's statistics every 5 s
# (PS2X_AUDIO_STATS: underruns, dropped, fill) and the stream log; areas and their sound banks stream in all the time.
profile m07-drive
env PS2X_RHI_STATS=1
env VCS_STREAM_LOG=1
env PS2X_AUDIO_STATS=1
seconds 960
report 10
every 4 10 26 press cross
at 32 scm b101cfa5070107010701070107019b00cfa52300
at 34 scm 600108d3002802480008d30009cd44c9c4097b5404c309c3f57c410d4e000d09cd44c9c4097b5404c3090000c8c21c02cfa50db2010d07010701070107010701620108d3002300
at 44 cruise start userdata/m06-city.txt 40 loop
every 60 60 900 cruise status
every 10 5 955 player
every 120 60 900 gameinfo
at 956 perf
