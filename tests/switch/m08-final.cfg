# M08 review 1: the acceptance run on the candidate, paired Joy-Cons attached, handheld, from an empty test card, intro
# movies skipped. The person: L3 + R3 open / close twice in the flyover (S2) and once in the intro cutscene (S3); skips
# it; in play (S4) opens and closes once; takes a gun from the trainer; holds R1 and clicks L3 (the game's free aim:
# "[devmenu] the game's free aim on" and game_free_aim in the reports, the game's own flag); with buttons only, starts and
# stops the frame-time recording; turns the free camera on and off; with a finger touches "Performance overlay" and
# "Close"; opens the menu and presses HOME, comes back and closes it; opens it, puts the console to sleep (power
# button), wakes it and closes it; then closes the game from HOME. The stage every 5 s for the first 3 minutes
# (gameinfo: the camera mode), the menus every 5 s, the game's pad read every 2 s for 400 s.
profile m08-final
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
env VCS_NX_INPUT_LOG=1
report 10
every 5 2 182 gameinfo
every 30 200 1190 gameinfo
every 5 1 1196 devmenu
every 2 1 399 padstate
