# M04-12: the indirect-site trace. The boot route of m04-boot plus a game save, with every guest branch through the
# out-of-line dispatcher (PS2X_FAST_DISPATCH=0) and src/switch/branch_trace.cpp recording each indirect jr / jalr
# site that runs, its distinct targets and any target missing from the function table; printed at shutdown as
# [branch-trace] lines for tools/classify_unhandled.py.
profile m04-branches
env VCS_SKIP_MOVIES=1
env PS2X_FAST_DISPATCH=0
env VCS_NX_BRANCH_TRACE=1
env VCS_TEST_SAVE=150
seconds 240
report 5
every 4 10 170 press cross
every 10 5 235 player
every 30 15 225 gameinfo
