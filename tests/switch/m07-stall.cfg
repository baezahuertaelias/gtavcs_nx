# M07-03: audio consumer timing against deliberate frame stalls. Cross every 4 s from 10 s skips the movies, the flyover
# and the intro cutscene (S4 by about 30 s, as m06-route.cfg); then, standing in S4 with nobody touching the console,
# stalls of the main thread (the frame: events, GL, present) and of the game thread (the guest: the sound producer) of
# 100 ms to 2 s, each followed by quiet time to recover. PS2X_AUDIO_STATS=1: the ring's underruns, dropped frames,
# queue depth and target fill every 5 s; perf.csv the frame times around each stall.
profile m07-stall
env PS2X_AUDIO_STATS=1
env PS2X_RHI_STATS=1
env PS2X_PERF_LOG=userdata/tests/m07-stall/perf.csv
seconds 330
report 5
every 4 10 26 press cross
every 10 5 325 player
every 60 30 300 gameinfo
at 60 stall main 100
at 75 stall main 250
at 90 stall main 500
at 110 stall main 1000
at 135 stall main 2000
at 165 stall game 100
at 180 stall game 250
at 195 stall game 500
at 215 stall game 1000
at 240 stall game 2000
at 326 perf
