# M05: the real game through the OpenGL RHI (upstream's HW GS renderer, PS2X_GS=hw), the upstream threading
# design (record on workers, every GL call on the main thread). Screenshots render through present::capture (the
# RHI); they are game pictures and stay private. Same press schedule as m04-boot.
profile m05-gl
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
env PS2X_CAPTURE_SIZE=640x448
seconds 240
report 5
every 4 10 170 press cross
every 10 5 235 frames
every 30 15 225 gameinfo
at 236 perf
at 8 screenshot userdata/tests/m05-gl/shot-008.png
at 20 screenshot userdata/tests/m05-gl/shot-020.png
at 40 screenshot userdata/tests/m05-gl/shot-040.png
at 60 screenshot userdata/tests/m05-gl/shot-060.png
at 90 screenshot userdata/tests/m05-gl/shot-090.png
at 120 screenshot userdata/tests/m05-gl/shot-120.png
at 150 screenshot userdata/tests/m05-gl/shot-150.png
at 180 screenshot userdata/tests/m05-gl/shot-180.png
at 210 screenshot userdata/tests/m05-gl/shot-210.png
at 230 screenshot userdata/tests/m05-gl/shot-230.png
