# M08-09 / 14 / 15 / 17: the developer menu's functions on paired Joy-Cons in handheld, from an empty test card, intro
# movies skipped. In S4 the person: through the menu opens the trainer and takes a gun, then holds R1 and clicks L3 (the
# game's free aim, L3 handed on late by the chord window); turns the free camera on, flies, turns it off; touches a
# menu row on the screen; then closes the game from HOME. Logged as m08-chord, plus the trainer use note
# (userdata/trainer-used.txt) and the touch mapping ([touch]).
profile m08-functions
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
env VCS_NX_INPUT_LOG=1
report 10
every 2 1 3599 devmenu
every 1 1 3599 padstate
every 10 5 3595 player
every 30 15 3585 gameinfo
