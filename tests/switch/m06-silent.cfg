# M06-17: no audio device at all (PS2X_AUDIO=0: ps2AudioInit never opens SDL's device, so nothing drains the ring);
# the native sound driver and the IOP still run. No presses: the S3 intro cutscene plays to its end by itself, which
# shows whether its pacing waits on audio progress. S4 must be reached (player answers) without input.
profile m06-silent
env PS2X_AUDIO=0
env PS2X_RHI_STATS=1
env PS2X_PERF_LOG=userdata/tests/m06-silent/perf.csv
env PS2X_CAPTURE_SIZE=640x448
seconds 360
report 5
every 10 5 355 player
every 30 15 345 gameinfo
at 30 screenshot userdata/tests/m06-silent/s2-030.png
at 60 screenshot userdata/tests/m06-silent/s3-060.png
at 120 screenshot userdata/tests/m06-silent/s3-120.png
at 180 screenshot userdata/tests/m06-silent/s3-180.png
at 240 screenshot userdata/tests/m06-silent/s4-240.png
at 300 screenshot userdata/tests/m06-silent/s4-300.png
at 350 screenshot userdata/tests/m06-silent/s4-350.png
at 356 perf
