# M07-02 / M07-10: everything the SPU2 produces from an empty test card through S1-S4, recorded as a WAV
# (upstream's PS2X_AUDIO_DUMP, written on the producer thread: not in the audio callback) for tools/pcm_compare.py
# against the desktop reference's recording of the same schedule. No input (the movies, the flyover and the intro
# cutscene play out; S4 by about 225 s), so both runs hear the same scene. The dump flushes to the card every push:
# not a timing run (M07-03 runs without it).
profile m07-pcm
env PS2X_AUDIO_DUMP=userdata/tests/m07-pcm/game.wav
env PS2X_AUDIO_STATS=1
env PS2X_RHI_STATS=1
seconds 300
report 5
every 10 5 295 player
every 30 15 285 gameinfo
at 296 perf
