# M08-02 / 03 / 04 / 17: the menus laid out at 1920x1080 in handheld (VCS_NX_OUTPUT=1080: the docked output, scaled
# down by the panel; docked itself is M10-13). From an empty test card, intro movies skipped. In S4 the person opens the
# developer menu with L3 + R3, goes to Settings, moves through the pages with L / R, turns "Show frame rate" on, closes
# with Circle, touches a row of the developer menu, and closes the game from HOME. A later automatic run of the same
# profile (m08-layout-relaunch) shows the setting was kept.
profile m08-layout1080
env VCS_SKIP_MOVIES=1
env VCS_NX_OUTPUT=1080
env PS2X_RHI_STATS=1
env VCS_NX_INPUT_LOG=1
report 10
every 5 1 1196 devmenu
every 20 5 985 player
every 60 10 1150 gameinfo
