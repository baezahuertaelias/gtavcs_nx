# M06-12: the heap during play. The same start as m06-route (Cross every 4 s skips S2 / S3), then 10 minutes at Fort
# Baxter with nobody touching the console. The progress line every 10 s carries heap_in_use / heap_obtained; a world
# leak shows as steady growth after the load settles. The [rhi-stats] line shows the renderer's objects.
profile m06-soak
env PS2X_RHI_STATS=1
seconds 720
report 10
every 4 10 70 press cross
every 60 30 690 gameinfo
at 715 perf
