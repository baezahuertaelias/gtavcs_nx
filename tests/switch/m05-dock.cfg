# M05-10/14: the OpenGL renderer across docking: the person docks and undocks the console several times during the
# run (prompted by the session tool); the log's [video] and [rhi] back buffer lines and the screenshots show the
# drawable following the dock.
profile m05-dock
env VCS_SKIP_MOVIES=1
env PS2X_RHI_STATS=1
seconds 180
report 5
every 4 10 170 press cross
every 10 5 175 frames
every 15 15 165 screenshot userdata/tests/m05-dock/shot-dock.png
at 176 perf
