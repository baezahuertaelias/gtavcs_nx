# M04-13 card files through GamePaths: the game saves to slot 1 through its own memory card code (upstream's
# VCS_TEST_SAVE, guest tail calls) on the run's test card. Run twice on the same card: the first save writes the
# card's files and its order file, the second changes a card that already holds a save, so a backup is written
# beside the one from the first run. Everything must land under gamefolder/userdata/tests/m04-save.
profile m04-save
env VCS_SKIP_MOVIES=1
env VCS_TEST_SAVE=90
seconds 140
report 5
every 4 10 70 press cross
every 10 5 135 player
at 135 gameinfo
