# M06-12, review 3: the heap during moving play with streaming. Cross every 4 s skips S2 / S3; at 34 s upstream's rig
# script (tools/rig.py spawn_car + Game.invincible, assembled with rig.Scm) makes car model 211 beside the S4 spot,
# warps the player into it and makes both proof against damage; then the rig's cruise moves the car along upstream's
# tools/routes/city.txt (~5.7 km over the busiest cells on both sides of the bay; copied to
# gamefolder/userdata/m06-city.txt) at 40 m/s in a loop, so new areas stream in all the time. (m06-cruise.cfg's
# Triangle presses did not put the player on the bike: the car never moved.) Nobody touches the console (auto-sleep
# off). heap_in_use / heap_obtained on the progress line every 10 s; VCS_STREAM_LOG=1 logs the stream reads.
profile m06-drive
env PS2X_RHI_STATS=1
env VCS_STREAM_LOG=1
seconds 1260
report 10
every 4 10 26 press cross
