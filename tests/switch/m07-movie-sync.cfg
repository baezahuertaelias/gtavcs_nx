# M07-07 / 08 / 11: the boot movies' audio / video sync under varying frame times, and a skip. VCS_MOVIE_LOG=1 logs
# every second the movie's sound pushed / queued / played, its clock (the sound played) and the due time of the next
# picture. During INTRO.PSS a 500 ms stall of the main thread (the frame) at 25 s and of the game thread (the movie
# player) at 35 s; at 50 s Cross skips the movie (the skip is allowed after the game's frame count); the audio stats
# show whether stale movie sound plays on after the skip. Then no input: S2, the intro cutscene (in-engine), S4.
profile m07-movie-sync
env VCS_MOVIE_LOG=1
env PS2X_AUDIO_STATS=1
env PS2X_RHI_STATS=1
seconds 240
report 5
at 25 stall main 500
at 35 stall game 500
at 50 press cross
every 10 5 235 player
every 30 15 225 gameinfo
at 236 perf
