# M04 lifecycle: HOME and sleep during a run (the person at the Switch acts; tools/switch_m04_session.py prompts).
# Progress lines must continue after each return; focus lines record each change.
profile m04-focus
env VCS_SKIP_MOVIES=1
seconds 150
report 5
every 4 10 60 press cross
every 10 5 145 frames
every 10 5 145 peek 0x489f7c 4
