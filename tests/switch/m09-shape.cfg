# M09-04: each presented frame's shape at the pause menu's switch, as upstream's regress step "menushape": Cross to S4,
# then every presented frame for 40 frames after Start, in and out (control command "burst"), at 320x180 (a 1280x720
# burst slows the Switch to about one frame a second: m09-wide.cfg, run wide-base). A frame's picture rectangle (4:3 or
# 16:9) must fit what it shows: the menu (no 3D) 4:3, the game wide. The folders userdata/tests/m09-burst/in and /out
# must exist (burst does not create them; the session makes them). Nobody touches the console.
profile m09-shape
env PS2X_CAPTURE_SIZE=320x180
seconds 150
report 10
every 4 10 70 press cross
every 10 10 140 gameinfo
at 100 burst userdata/tests/m09-burst/in 40
at 100 press start 150
at 120 burst userdata/tests/m09-burst/out 40
at 120 press start 150
at 145 perf
