# M07-04 / 05 / 08 / 09 / 11: the person presses HOME during the opening movie and resumes it, then plays the first
# mission (its cutscene speech, sounds and music) and closes from HOME. No time limit. VCS_MOVIE_LOG=1 gives the movie's
# sync across the HOME; audio stats every 5 s; every input logged; gameinfo every 30 s.
profile m07-mission
env PS2X_AUDIO_STATS=1
# M07-04 (review 1): the SPU2 voices sounding at once, every 5 s ("[spu2] 5 s: ... active now N")
env PS2X_TRACE_SPU2=1
env VCS_MOVIE_LOG=1
env PS2X_RHI_STATS=1
env VCS_NX_INPUT_LOG=1
env VCS_STREAM_LOG=1
report 10
every 10 5 3595 player
every 30 15 3585 gameinfo
