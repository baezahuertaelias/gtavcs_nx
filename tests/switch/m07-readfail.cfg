# M07-09 (review 1, finding 6): a movie that cannot be decoded. Before the run the session puts a file of zeros the size
# of MOVIES/STINGS.PSS at gamefolder/mods/MOVIES/STINGS.PSS (the folder disc's same-size mod override, so the disc
# layout and the original file stay as they are) and removes it after. Expected: STINGS.PSS fails ("[movie] ...") and
# the game goes on as if it was skipped; INTRO.PSS, the sound and S4 follow. No input.
profile m07-readfail
env VCS_MOVIE_LOG=1
env PS2X_AUDIO_STATS=1
env PS2X_RHI_STATS=1
seconds 240
report 5
every 10 5 235 player
every 30 15 225 gameinfo
at 236 perf
